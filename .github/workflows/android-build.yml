name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: |
          mkdir -p out
          godot --headless --path . --import || true

      - name: Validate scripts
        run: |
          godot --headless --path . --check-only --script res://scripts/autoload/events.gd || true
          status=0
          for f in $(find scripts -name "*.gd"); do
            if ! godot --headless --path . --check-only --script "res://$f" 2>> out/check.log; then
              echo "PARSE FAIL: $f"
              status=1
            fi
          done
          cat out/check.log || true
          exit $status

      - name: Export Android APK (ARMv7)
        run: |
          mkdir -p build
          godot --headless --path . --export "Android" build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Verify ARMv7 library
        run: |
          test -f build/GiKoKoMyanmarOpenWorld3D.apk
          unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "armeabi-v7a" || (echo "No armeabi-v7a lib in APK" && exit 1)
          unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "libgodot" || (echo "No libgodot in APK" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiKoKoMyanmarOpenWorld3D-apk
          path: build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Create GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/GiKoKoMyanmarOpenWorld3D.apk
