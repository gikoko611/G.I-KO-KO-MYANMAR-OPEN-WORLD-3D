name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: |
          mkdir -p build out
          godot --headless --path . --import || godot --headless --path . -e --quit-after 200 || true

      - name: Validate scripts (advisory)
        continue-on-error: true
        run: |
          fails=0
          for f in $(find scripts -name "*.gd"); do
            if ! godot --headless --path . --check-only --script "res://$f" > /dev/null 2>> out/check.log; then
              echo "PARSE FAIL: $f"
              fails=1
            fi
          done
          if [ -s out/check.log ]; then
            echo "----- parser output -----"
            tail -n 200 out/check.log
          fi
          echo "Validation is advisory: the build continues even if some scripts report errors here."

      - name: Export Android APK (ARMv7)
        run: |
          godot --headless --path . --export "Android" build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Verify ARMv7 library
        run: |
          test -f build/GiKoKoMyanmarOpenWorld3D.apk
          unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "armeabi-v7a" || (echo "No armeabi-v7a lib in APK" && exit 1)
          unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "libgodot" || (echo "No libgodot in APK" && exit 1)
          ls -lh build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiKoKoMyanmarOpenWorld3D-apk
          path: build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Create GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "G.I KO KO - Myanmar Open World 3D v1.0.0"
          body: |
            G.I KO KO - Myanmar Open World 3D v1.0.0
            Powered by I KO KO

            3D open-world farming, survival and exploration game set in a
            Myanmar river valley. Godot 3.5.2, GLES2, Android 10+
            (armeabi-v7a / 32-bit), tuned for Redmi 9A class devices.

            Install: download the APK below, allow "install unknown apps",
            then open. Set Settings -> Graphics to Low on 2-3 GB RAM phones.
          files: build/GiKoKoMyanmarOpenWorld3D.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
