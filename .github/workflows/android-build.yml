name: Android Build

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 3.5.2 headless and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/3.5.2-stable/Godot_v3.5.2-stable_linux_headless.64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/3.5.2-stable/Godot_v3.5.2-stable_export_templates.tpz
          unzip -q Godot_v3.5.2-stable_linux_headless.64.zip
          unzip -q Godot_v3.5.2-stable_export_templates.tpz
          sudo mv Godot_v3.5.2-stable_linux_headless.64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/templates/3.5.2.stable ~/.config/godot ~/.android
          mv templates/* ~/.local/share/godot/templates/3.5.2.stable/
          godot --version || true

      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android SDK
        run: |
          cat > ~/.config/godot/editor_settings-3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          export/android/release_keystore = "/home/runner/.android/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_password = "android"
          EOF

      - name: Import project and reject script parse errors
        run: |
          set +e
          timeout 120 godot --path . -e --quit > import.log 2>&1
          status=$?
          set -e
          cat import.log
          if grep -nE "SCRIPT ERROR|Parse Error" import.log; then
            echo "Godot reported a GDScript error"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Godot import failed with exit code $status"
            exit "$status"
          fi

      - name: Export ARMv7 APK
        run: |
          mkdir -p build
          godot --path . --export "Android" build/GiKoKoMyanmarOpenWorld3D.apk 2>&1 | tee export.log
          test -s build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Verify APK signature and ARMv7 payload
        run: |
          jarsigner -verify build/GiKoKoMyanmarOpenWorld3D.apk
          unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "lib/armeabi-v7a/"
          if unzip -l build/GiKoKoMyanmarOpenWorld3D.apk | grep -q "lib/arm64-v8a/"; then
            echo "Unexpected ARM64 payload in ARMv7-only build"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiKoKoMyanmarOpenWorld3D-${{ github.sha }}
          path: build/GiKoKoMyanmarOpenWorld3D.apk
          retention-days: 14
