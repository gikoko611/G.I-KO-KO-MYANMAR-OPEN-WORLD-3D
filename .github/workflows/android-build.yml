name: Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot Android export (3.5.2, ARMv7)
        uses: dulvui/godot-android-export@v3.0.0
        with:
          godot-version: 3.5.2

      - name: Validate all scripts
        run: |
          status=0
          echo "" > check.log
          while IFS= read -r f; do
            if ! godot --path . --check-only -s "res://$f" 2>> check.log; then
              echo "PARSE FAIL: $f"
              status=1
            fi
          done < <(find scripts -name "*.gd" | sort)
          cat check.log
          exit $status

      - name: Verify APK
        run: |
          test -f build/GiKoKoMyanmarOpenWorld3D.apk
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiKoKoMyanmarOpenWorld3D-apk
          path: build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: G.I KO KO – Myanmar Open World 3D v1.0.0
          body: |
            Open-world farming / survival / exploration game set in a Myanmar
            river valley. Godot 3.5.2, GLES2, ARMv7 (armeabi-v7a) for Android
            10+ — optimized for Redmi 9A class phones.

            Note: all visuals and audio are procedural placeholders.

            Powered by I KO KO
          files: build/GiKoKoMyanmarOpenWorld3D.apk

      - name: Record failure log on ci-status branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-status
          cp check.log .ci-last-error.log 2>/dev/null || echo "unknown error (see Actions log)" > .ci-last-error.log
          git add .ci-last-error.log
          git commit -m "ci: record failure log" || true
          git push origin ci-status --force
